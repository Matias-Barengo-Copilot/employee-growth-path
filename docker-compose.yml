version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot-lms-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
